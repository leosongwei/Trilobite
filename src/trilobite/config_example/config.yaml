model: "deepseek-chat"
api_key: "your-api-key-here"
api_url: "https://api.deepseek.com/v1"
reasoning_effort: "max"
max_context_tokens: 1048576
max_tokens: 65536
log_level: WARNING
compaction_trigger_ratio: 0.7
enable_vl: false
# 预定义模型列表：每个模型是一份独立的 API 配置（模型名、地址、密钥、VLM、
# 上下文/输出上限、压缩阈值）。会话可随时切换主模型，切换后下一次发送生效。
# 字段缺省时：enable_vl=false，max_context=400k，max_tokens=64k，
# compaction_trigger_ratio=0.7。api_key/api_url 缺省时回退到顶层同名字段。
# extra_body 会原样合并进请求体，用于思考模式等厂商特有字段，如
# {"reasoning_effort": "max", "thinking": {"type": "enabled"}}。
models:
  - name: "DeepSeek"
    model: "deepseek-chat"
    api_key: "your-api-key-here"
    api_url: "https://api.deepseek.com/v1"
    enable_vl: false
    max_context: 1048576
    max_tokens: 65536
    compaction_trigger_ratio: 0.7
    extra_body:
      reasoning_effort: max
    # 是否伪装成 opencode 客户端发送请求头（User-Agent、session id 等）。
    # 默认 true，对 DeepSeek 等线上服务保持兼容；对本地 llama.cpp 等不需要
    # Bearer 认证的服务，设为 false 并留空 api_key 可省略 Authorization 头。
    pretend_to_be_opencode: true
  # 本地 llama.cpp 示例：关闭 opencode 伪装且 api_key 留空，避免发送 Bearer 头
  # - name: "llama.cpp"
  #   model: "local-model"
  #   api_key: ""
  #   api_url: "http://127.0.0.1:8080/v1"
  #   pretend_to_be_opencode: false
# 默认模型（models 中的 name）；未配置时取 models 第一项
default_model: "DeepSeek"
# 默认视觉模型，预留字段，暂未使用
default_vl_model: ""
# 服务监听地址：127.0.0.1 仅本机可访问；0.0.0.0 开放所有网卡（局域网内可访问，受 token 保护）
host: "127.0.0.1"
# 服务监听端口
port: 2345
# 额外的 skill 搜索目录（相对路径基于工作目录，支持 ~ 展开），如 ["~/team-skills"]
skill_dirs: []
# 全局固定授权目录：所有会话默认可访问（文件工具 + bash 沙箱可写），
# 不走按会话的权限审批、UI 上不可移除。支持 ~ 展开，相对路径基于各会话
# 工作目录解析，如 ["/home/user/shared-libs", "~/scripts"]
allowed_dirs: []
# bash 沙箱（仅 Linux，依赖 bubblewrap/bwrap）：auto=探测到就用、否则裸跑并提示；
# on=强制沙箱、不可用则拒绝执行；off=关闭沙箱。沙箱内仅工作目录和已授权目录可写。
bash_sandbox: auto
