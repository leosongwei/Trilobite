<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trilobite</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: ui-monospace, 'Cascadia Code', monospace; background: #1e1e2e; color: #cdd6f4; height: 100vh; display: flex; }
.sidebar { width: 260px; background: #181825; border-right: 1px solid #313244; display: flex; flex-direction: column; overflow: hidden; }
.sidebar-header { padding: 16px; border-bottom: 1px solid #313244; }
.sidebar-header h1 { font-size: 16px; color: #cba6f7; margin-bottom: 8px; }
.sidebar-header input { width: 100%; padding: 8px; background: #1e1e2e; border: 1px solid #313244; color: #cdd6f4; border-radius: 4px; font-family: inherit; }
.sidebar-header button { width: 100%; margin-top: 8px; padding: 8px; background: #cba6f7; color: #1e1e2e; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: inherit; }
.sessions { flex: 1; overflow-y: auto; padding: 8px; }
.session-item { padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
.session-item:hover { background: #313244; }
.session-item.active { background: #45475a; }
.session-item .delete { color: #f38ba8; cursor: pointer; padding: 0 4px; }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.chat { flex: 1; overflow-y: auto; padding: 16px; }
.message { margin-bottom: 8px; }
.message.user { color: #89b4fa; }
.message.assistant { color: #a6e3a1; white-space: pre-wrap; }
.message.error { color: #f38ba8; }
.turn-block { margin: 12px 0 12px 16px; padding-left: 12px; border-left: 2px solid #45475a; }
.turn-block .thinking { margin-bottom: 6px; color: #6c7086; font-style: italic; white-space: pre-wrap; }
.turn-block .thinking summary { cursor: pointer; color: #585b70; font-style: normal; }
.turn-block .thinking summary:hover { color: #a6adc8; }
.tool-entry { margin: 4px 0 8px 8px; }
.tool-action { color: #cba6f7; font-size: 13px; margin-bottom: 2px; }
.tool-result { color: #f9e2af; font-size: 13px; margin: 0; padding: 4px 8px; background: #181825; border-radius: 4px; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
.input-area { padding: 16px; border-top: 1px solid #313244; display: flex; gap: 8px; }
.input-area textarea { flex: 1; padding: 8px; background: #181825; border: 1px solid #313244; color: #cdd6f4; border-radius: 4px; font-family: inherit; resize: none; min-height: 40px; max-height: 120px; }
.input-area button { padding: 8px 16px; background: #cba6f7; color: #1e1e2e; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: inherit; }
.input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
#stopBtn { background: #f38ba8; padding: 8px 12px; font-size: 14px; }
#stopBtn:disabled { background: #45475a; opacity: 0.3; }
#stopBtn:not(:disabled):hover { background: #f06292; }
.token-bar { padding: 4px 16px 8px; font-size: 11px; color: #6c7086; font-family: ui-monospace, 'Cascadia Code', monospace; }
.token-bar.warn { color: #f9e2af; }
.token-bar.danger { color: #f38ba8; }
.empty-state { display: flex; align-items: center; justify-content: center; height: 100%; color: #6c7086; }
.sidebar-header .working-dir { margin-top: 4px; }
.sidebar-header .working-dir input { margin-top: 4px; }
.sidebar-header label { font-size: 11px; color: #6c7086; display: block; margin-top: 6px; }
</style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-header">
        <h1>Trilobite</h1>
        <input type="text" id="sessionName" placeholder="Session name">
        <label>Working directory:</label>
        <input type="text" id="workingDir" placeholder="/home/user/project">
        <button id="createSessionBtn">+ New Session</button>
    </div>
    <div class="sessions" id="sessionList"></div>
</div>
<div class="main">
    <div class="chat" id="chat"></div>
    <div class="input-area">
        <textarea id="messageInput" placeholder="Type a message..." rows="1"></textarea>
        <button id="sendBtn">Send</button>
        <button id="stopBtn" title="Stop" disabled>&#9632;</button>
    </div>
    <div class="token-bar" id="tokenBar">Tokens: &mdash;</div>
</div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
