[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trilobite-code"
version = "1.2.10"
description = "Add your description here"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "croniter>=3.0.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.0",
    "openai>=2.38.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.48.0",
]

[project.scripts]
trilobite = "src.trilobite.server:main"

[tool.uv.sources]
trilobite-code = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

# Ship the frontend build output (src/trilobite/static) and the bundled
# config_example/ templates inside the wheel. MANIFEST.in handles the sdist;
# this flag plus MANIFEST.in ensures both sdist and wheel carry the data files.
# (static/ is gitignored, so we must NOT rely on VCS-based include_package_data
# alone -- MANIFEST.in's recursive-include ignores .gitignore.)
[tool.setuptools]
include-package-data = true
